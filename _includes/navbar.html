<style>
    /* 宽屏：相对于导航栏居中 */
    .navbar-name {
        position: absolute;
        top: 5px;
        left: 50%;
        transform: translateX(-50%);
        margin: 0 !important;
        max-width: 35vw;
        overflow: visible;

        font-size: 2.5rem !important;
        line-height: 1.2;
        color: #000 !important;
        text-decoration: none !important;
        white-space: nowrap;
        text-overflow: ellipsis;
        cursor: pointer;
        z-index: 2;
    }

    /* Ensure link color stays black on all states */
    .navbar-name:hover,
    .navbar-name:focus,
    .navbar-name:active,
    .navbar-name:visited {
        color: #000 !important;
        text-decoration: none !important;
    }

    /* 中等屏幕：紧跟在 Logo 右边 */
    @media (min-width: 400px) and (max-width: 800px) {
        .navbar-name {
            position: relative;
            top: 0;
            left: auto;
            transform: none;

            align-self: center;
            flex-shrink: 0;

            max-width: 180px;
            margin-left: 0.25rem !important;
            margin-right: 0.75rem !important;
            padding-top: 0.3rem;
            padding-bottom: 0;

            font-size: 2rem !important;
            line-height: 1.3;
            overflow: visible;
            color: #000 !important;
        }
    }

    /* 小屏幕：隐藏 */
    @media (max-width: 399.98px) {
        .navbar-name {
            display: none !important;
        }
    }
</style>

<nav class="navbar navbar-expand-sm navbar-light fixed-top mb-5 shadow-sm">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %} d-flex align-items-center position-relative w-100">

        <a
            href="https://www.bschool.cuhk.edu.hk/"
            target="_blank"
            rel="noopener noreferrer"
            style="flex-shrink: 0;">
            <img
                src="{{ site.data.profile.logo_url | relative_url }}"
                alt="Logo"
                style="
                    display: block;
                    width: 120px;
                    height: 60px;
                    object-fit: cover;
                    margin-right: 8px;
                ">
        </a>

        <!--<a
            class="navbar-brand navbar-name mrs-saint-delafield-regular"
            href="{{ '/' | relative_url }}">
            {{ site.data.profile.navbar_name }}
        </a>-->

        <button
            class="navbar-toggler ml-auto"
            style="
                flex-shrink: 0;
                font-size: 1em;
                padding: 0.5em;
            "
            type="button"
            data-toggle="collapse"
            data-target="#navbarResponsive"
            aria-controls="navbarResponsive"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <i class="fas fa-map"></i> Menu
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_title or include.active_page == item.name %}active{% endif %}">
                    <a
                        class="nav-link"
                        href="{{ item.url | relative_url }}">
                        {{ item.name }}
                    </a>
                </li>
                {% endfor %}
            </ul>
        </div>

    </div>
</nav>
